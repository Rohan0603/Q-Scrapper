name: Multi-store stock check

# Runs the stock notifier on a schedule. Sends Telegram alerts only when
# something has changed since the previous run (dedup state is cached
# across runs via actions/cache).

on:
  # Every 15 minutes. GitHub Actions cron schedules can be delayed under
  # load; expect "approximately" every 15 minutes, not exact.
  schedule:
    - cron: "*/15 * * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Only one run at a time; cancel any older queued run if a newer one is
# triggered (prevents duplicate Telegram alerts).
concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Install Playwright Chromium (with system deps)
        run: python -m playwright install --with-deps chromium

      - name: Restore notifier state cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: Run stock notifier (one-shot)
        env:
          RUN_ONCE: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_DEBUG: "1"
          DEBUG_DIR: "debug"
          ENABLED_STORES: ${{ vars.ENABLED_STORES }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          LOCALITY: ${{ vars.LOCALITY }}
          LANDMARK: ${{ vars.LANDMARK }}
          CITY: ${{ vars.CITY }}
          STATE: ${{ vars.STATE }}
          # Optional location overrides — defaults are Whitefield, Bengaluru.
          BLINKIT_LAT: ${{ vars.BLINKIT_LAT }}
          BLINKIT_LON: ${{ vars.BLINKIT_LON }}
          BLINKIT_LOCALITY: ${{ vars.BLINKIT_LOCALITY }}
          BLINKIT_LANDMARK: ${{ vars.BLINKIT_LANDMARK }}
          BLINKIT_CITY: ${{ vars.BLINKIT_CITY }}
          BLINKIT_STATE: ${{ vars.BLINKIT_STATE }}
        run: python -u main.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: debug
          if-no-files-found: ignore

      - name: Save notifier state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
